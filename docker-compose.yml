version: '3.8'
services:
  db:
    image: postgres:16
    container_name: mk_drycleaners_db
    environment:
      POSTGRES_DB: mk_drycleaners
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
